function seq(a){const R={v:-1,c:0,t:0,l:1,b:2,d:3,w:3.5,m:3.7,f:4,r:4,x:5};let r;for(let n=0;n<30;n++){r=shuf(a).sort((p,q)=>R[p.k]-R[q.k]);if(r.every((x,i)=>!i||!(x.w&&x.w===r[i-1].w)))break}return r}
function mix(a){let r;for(let t=0;t<40;t++){r=mix1(a);if(r.every((x,i)=>!i||(x.k!==r[i-1].k&&!(x.w&&x.w===r[i-1].w))||(i<2&&x.k===r[i-1].k&&x.w!==r[i-1].w)))break}return r}
function mix1(a){const p=shuf(a),r=[];for(let i=0;i<2;i++){const j=p.findIndex(x=>x.k==='c');if(j>=0)r.push(p.splice(j,1)[0])}
 while(p.length){const c={};p.forEach(x=>c[x.k]=(c[x.k]||0)+1);const l=r[r.length-1];let pool=p.filter(x=>!l||(x.k!==l.k&&!(x.w&&x.w===l.w)));if(!pool.length)pool=p;const m=Math.max(...pool.map(x=>c[x.k])),big=pool.filter(x=>c[x.k]===m),pk=p.length>6?pool[0]:big[0];r.push(p.splice(p.indexOf(pk),1)[0])}
 return r}

function lev(a,b){const m=a.length,n=b.length,d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
